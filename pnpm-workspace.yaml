minimumReleaseAgeExcludePrune: true

trustPolicy: no-downgrade
# The upstream npm release lacks provenance; keep the exception version-scoped.
# Verified registry ownership and the upstream v2.2.2 release.
trustPolicyExclude:
  - lefthook@2.2.2

shellEmulator: true

patchedDependencies:
  nextra-theme-docs@4.6.1: patches/nextra-theme-docs@4.6.1.patch

allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  esbuild: false
  lefthook: true
  sharp: true
  workerd: true
