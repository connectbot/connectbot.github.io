name: CI

on:
  push:
  pull_request:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: read
      deployments: write
    # Match the OS supported by the pinned Playwright version.
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # Check out history for "Last Modified" markers in Nextra
          fetch-depth: 0

      - uses: pnpm/action-setup@v6.1.1

      - name: Use Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '26'
          cache: pnpm

      - name: Restore cache
        uses: actions/cache@v6.1.0
        with:
          path: |
            .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-

      - name: Install dependencies
        run: pnpm install

      - name: Lint
        run: pnpm run lint

      - name: Type Check
        run: pnpm run check:types

      - name: Keyboard contract tests
        run: pnpm test:keyboards

      - name: Build
        run: pnpm run build

      - name: Install keyboard test browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Keyboard browser tests
        run: pnpm exec playwright test tests/keyboards --project=chromium

      - name: Deploy to Cloudflare Pages
        if: github.ref == 'refs/heads/develop' && github.repository == 'connectbot/connectbot.github.io' && github.event_name == 'push'
        uses: cloudflare/wrangler-action@v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_PAGES_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy ./out --project-name=connectbot-website
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

  webauthn:
    strategy:
      matrix:
        site: [webauthn, webauthn-debug]
    permissions:
      contents: read
      deployments: write
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Validate WebAuthn association
        run: python3 scripts/check-webauthn.py
      - name: Package WebAuthn site
        run: python3 scripts/prepare-webauthn.py ${{ matrix.site }}
      - uses: pnpm/action-setup@v6.1.1
      - name: Use Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '26'
      - name: Deploy WebAuthn association
        if: github.ref == 'refs/heads/develop' && github.repository == 'connectbot/connectbot.github.io' && github.event_name == 'push'
        uses: cloudflare/wrangler-action@v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_PAGES_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy ./local/${{ matrix.site }} --project-name=connectbot-${{ matrix.site }} --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
